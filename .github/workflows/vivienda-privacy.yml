name: vivienda · degradación de privacidad

# A diario: borra de la BD el punto exacto de las convocatorias terminadas (barrio/municipio).
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  degrade:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.VIVIENDA_DATABASE_URL }}
    defaults:
      run:
        working-directory: vivienda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vivienda/package-lock.json
      - name: Degradar precisión
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Sin VIVIENDA_DATABASE_URL: nada que hacer"; exit 0; fi
          npm ci
          npm run privacy:degrade
