name: vivienda · CI

on:
  push:
    paths: ["vivienda/**", ".github/workflows/vivienda-ci.yml"]
  pull_request:
    paths: ["vivienda/**", ".github/workflows/vivienda-ci.yml"]

defaults:
  run:
    working-directory: vivienda

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/unit
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vivienda/package-lock.json
      - run: npm ci
      - name: Crear bases de datos de prueba
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -c "create database unit" -c "create database e2e"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: vivienda/test-results
